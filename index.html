<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Learning Curve</title>

		<link rel="stylesheet" href="./style.css" />
		<link rel="stylesheet" href="./themes.css" />
	</head>

	<body>
		<div id="theme-switcher"></div>
	<header class="hero">
		  <p class="eyebrow">LEARNING CURVE</p>

		  <h1>Programming Knowledge</h1>

		  <p class="description">
		    Learn concepts from fundamentals before diving into syntax.
		  </p>
		  <input
		    id="search-input"
		    class="search-bar"
		    type="text"
		    placeholder="Search topics by title or content…"
		    autocomplete="off"
		  />
		</header>

		<main>
			<section>
				<div class="section-header">
					<h2>Topics</h2>
					<span id="topic-count">0 topics</span>
				</div>

				<div id="topics" class="topics">
					<!-- Topics are generated by JavaScript -->
				</div>
				<div id="no-results" class="no-results"></div>
				</section>
		</main>

		<script src="./theme.js"></script>
	<script src="./script.js"></script>
	</body>
</html>
